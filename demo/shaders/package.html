<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noisemaker Portable package viewer</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #realms { position: fixed; inset: 0; }
        /* A realm loads hidden, and is shown once it is accepted. */
        .portable-realm { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; visibility: hidden; }
        .portable-realm.active { visibility: visible; }
        #status {
            position: fixed; left: 0; right: 0; bottom: 0; padding: 2px 8px;
            font: 12px/1.5 ui-monospace, monospace; color: #ccc; background: rgba(0, 0, 0, 0.7);
            pointer-events: none;
        }
        #status.error { color: #f88; }
    </style>
</head>
<body>
    <div id="realms"></div>
    <div id="status">Initializing...</div>
    <script type="module" src="./lib/portable-host.js"></script>
</body>
</html>
