# Notify the downstream release pipeline of pushes to main.
name: Downstream

on:
  push:
    branches: [main]
    paths:
      - 'shaders/**'
      - 'demo/shaders/**'
      - '.mcp.json'
      - 'vendor/shade-mcp/**'
      - 'pull-shade-mcp'
      - '.github/workflows/pull-shade-mcp.yml'
      - 'test/mcp-config.test.js'
      - '!**.md'

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # The queue matches a notice by repository and paths, not by branch, so this
      # side sends one only for a 1.x tree: the version in pyproject.toml, where the
      # release reads the series, must be of major 1.
      - name: Require a 1.x tree
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/pyproject.toml"
          if ! metadata=$(curl -fsSL --retry 3 --max-time 30 "$url"); then
            echo "::error::pyproject.toml of ${GITHUB_SHA} could not be read; no downstream notice is sent"
            exit 1
          fi
          # project.version, as the release's reader takes it; any TOML it cannot read gives no version.
          version=$(python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read()).get("project", {}).get("version", ""))' <<< "$metadata" 2>/dev/null) || version=""
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "::error::pyproject.toml of ${GITHUB_SHA} declares no readable version (read: '${version}'); no downstream notice is sent"
            exit 1
          fi
          major=${version%%.*}
          if [ "$major" != 1 ]; then
            echo "::error::pyproject.toml of ${GITHUB_SHA} declares version ${version}, of major ${major}; a downstream notice is sent only for a 1.x tree"
            exit 1
          fi
          echo "pyproject.toml of ${GITHUB_SHA} declares version ${version}, of major 1"

      - name: Check the downstream dispatch configuration
        env:
          QUEUE_REPOSITORY: ${{ secrets.QUEUE_REPOSITORY }}
        run: |
          missing=""
          [ -n "$QUEUE_REPOSITORY" ] || missing="$missing QUEUE_REPOSITORY"
          if [ -n "$missing" ]; then
            echo "::error::The downstream dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.QUEUE_REPOSITORY }}

      - name: Notify
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          QUEUE_REPOSITORY: ${{ secrets.QUEUE_REPOSITORY }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY_OWNER/$QUEUE_REPOSITORY/dispatches" \
            -f event_type=push \
            -f 'client_payload[repo]=${{ github.repository }}' \
            -f 'client_payload[ref]=${{ github.ref }}' \
            -f 'client_payload[before]=${{ github.event.before }}' \
            -f 'client_payload[after]=${{ github.event.after }}' \
            -F 'client_payload[forced]=${{ github.event.forced }}'
