name: Shaders

on:
  push:
    branches: [ main ]
    paths:
      - 'shaders/**'
      - '!shaders/README-SHADERS.md'
      - '!shaders/AGENTS.md'
      - '!shaders/effects/HELP_TEMPLATE.md'
      - 'vendor/shade-mcp/**'
      - 'scripts/**'
      - 'demo/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/shaders.yml'
    tags:
      - 'shaders-v*'
  pull_request:
    branches: [ main ]
    paths:
      - 'shaders/**'
      - '!shaders/README-SHADERS.md'
      - '!shaders/AGENTS.md'
      - '!shaders/effects/HELP_TEMPLATE.md'
      - 'vendor/shade-mcp/**'
      - 'scripts/**'
      - 'demo/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/shaders.yml'

permissions:
  contents: read

jobs:
  test:
    name: Shader tests
    runs-on: ubuntu-latest
    outputs:
      ships: ${{ steps.ships.outputs.ships }}

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0

    # vendor/shade-mcp/ is test tooling: it is not in the shader bundle or the
    # site. A push that changes nothing else (a shade-mcp release drop) is
    # tested like any other, but releasing an identical engine to the CDN and
    # rebuilding the site for it is not useful.
    - name: Decide whether this push changes what ships
      id: ships
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
          && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
          && ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qv '^vendor/shade-mcp/'; then
          echo "Only vendor/shade-mcp/ changed; the bundle and site stay as they are."
          echo "ships=false" >> "$GITHUB_OUTPUT"
        else
          echo "ships=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --include=dev

    - name: Verify shader parity attestations (CPU only)
      env:
        SHADER_PARITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        SHADER_PARITY_ALL: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: npm run test:shaders:parity-attestations

    - name: Run DSL language tests
      run: npm run test:shaders:lang

    - name: Run renderer sink and frame export tests
      run: npm run test:shaders:runtime

    - name: Install Playwright browsers
      run: npx playwright install chromium

    - name: Run shader compile and render test
      run: npm run test:shaders:render:webgl2

    - name: Run shader structure tests
      run: npm run test:shaders:structure

  # WebGL2/WebGPU suites need a real GPU; hosted runners only offer software
  # Vulkan, where these suites take over an hour. They run on a self-hosted
  # Apple Silicon runner in the noisemaker-gpu runner group. That group only
  # accepts this workflow file from main, so pull requests (including forks,
  # which can rewrite this file) never reach the machine. Pull requests get
  # the hosted suites above; main verifies the GPU suites before bundling.
  gpu:
    name: GPU tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      group: noisemaker-gpu
      labels: [noisemaker-gpu]
    timeout-minutes: 18
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        persist-credentials: false

    # No hosted npm cache: the runner keeps ~/.npm on its own disk, and the
    # cache-save post step hung past the job timeout on this runner.
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'

    # Install scripts would run dependency code on the office machine.
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Install Playwright browsers
      run: npx playwright install chromium

    - name: Verify WebGPU uploads, resampling, and storage execution
      run: npm run test:shaders:render:webgpu

    - name: Verify alpha compositing on both GPU backends
      run: npm run test:shaders:alpha

    - name: Verify WebGPU frame export matches canvas presentation
      run: npm run test:shaders:frame-export-orientation

    - name: Verify voxel heightfields and landscape rendering on both GPU backends
      run: npm run test:shaders:landscape

    - name: Verify particle heightmaps and focus on both GPU backends
      run: npm run test:shaders:particles

    - name: Verify classicNoisedeck/effects matches WebGL2 on WebGPU
      run: npm run test:shaders:classic-effects

    - name: Verify effects show their input unmirrored on both GPU backends
      run: npm run test:shaders:orientation

  bundle:
    name: Bundle shaders
    runs-on: ubuntu-latest
    needs: [test, gpu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.ships == 'true'

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install --include=dev

    - name: Build shader bundles
      run: npm run bundle:shaders

    - name: Package shader bundle
      run: |
        mkdir -p dist/release
        tar -C dist -czf dist/release/noisemaker-shaders.tar.gz shaders/ effects/

    - name: Upload shader bundle artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: noisemaker-shaders
        path: dist/release/noisemaker-shaders.tar.gz
        retention-days: 7

  deploy-site:
    name: Dispatch scaffold static-site-release
    runs-on: ubuntu-latest
    needs: bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}

    # The site showcases the shaders, so a shader change rebuilds it.
    # This dispatches the same `noisemaker-site` release that site.yml
    # does; scaffold's per-site concurrency group serializes the two
    # triggers rather than racing two `rsync --delete` runs against one
    # content root. Scaffold holds the deploy key, not this public repo.

    steps:
    - name: Mint scaffold GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: Iv23liy6T6BW0BXuZRzx
        private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
        owner: noisefactorllc
        repositories: scaffold

    - name: Dispatch scaffold static-site-release for noisemaker.app
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh workflow run static-site-release.yml \
          --repo noisefactorllc/scaffold \
          --ref main \
          -f site=noisemaker-site \
          -f sha=${{ github.sha }}
        echo "Dispatched scaffold static-site-release for noisemaker-site @ ${{ github.sha }}"

  deploy-shaders:
    name: Dispatch scaffold library-release
    runs-on: ubuntu-latest
    needs: bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}

    # Under the tag-on-commit scheme, scaffold is the sole authority
    # for shader library releases: it builds, computes next patch,
    # deploys to the CDN origin, updates the rolling MAJOR.MINOR
    # symlink, creates the git tag, and purges the CDN. This job just
    # fires the workflow_dispatch. See scaffold/platform/README.md
    # "Tag-on-commit mechanism" for the full contract.

    steps:
    - name: Mint scaffold GitHub App token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: Iv23liy6T6BW0BXuZRzx
        private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
        owner: noisefactorllc
        repositories: scaffold

    - name: Dispatch scaffold library-release for noisemaker
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh workflow run library-release.yml \
          --repo noisefactorllc/scaffold \
          --ref main \
          -f library=noisemaker \
          -f sha=${{ github.sha }}
        echo "Dispatched scaffold library-release for noisemaker @ ${{ github.sha }}"
