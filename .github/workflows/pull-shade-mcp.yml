# Vendor a shade-mcp release when one is published. The drop lands on main
# only after scripts/test-shade-mcp passes against it.
name: Pull shade-mcp

on:
  repository_dispatch:
    types: [shade-mcp-updated]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to download (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

# Releases can arrive minutes apart. Running drops one at a time keeps an
# older release from landing on top of a newer one.
concurrency:
  group: pull-shade-mcp
  cancel-in-progress: false

jobs:
  pull-shade-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liVHXh37ZQ13M67k
          private-key: ${{ secrets.NOISEDECK_APP_PRIVATE_KEY }}
          owner: noisefactorllc

      - name: Checkout noisemaker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Run pull-shade-mcp
        env:
          SHADE_MCP_TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 pull-shade-mcp

      - name: Check for changes
        id: changes
        run: |
          git add -A vendor/shade-mcp
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # The drop is tested here, before it reaches main, so a release that
      # breaks the shader suites never turns main red.
      - name: Set up Node.js
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.changes.outputs.has_changes == 'true'
        run: npx playwright install chromium

      - name: Test the drop
        if: steps.changes.outputs.has_changes == 'true'
        run: scripts/test-shade-mcp

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          SHADE_MCP_TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag }}
        run: |
          # The commit carries only the staged drop. A test that rewrote a
          # tracked file would also block the rebase below, so stop here.
          if ! git diff --quiet; then
            git status --short
            echo "::error::the drop tests modified tracked files"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "pull upstream shade-mcp dist

          shade-mcp release: ${SHADE_MCP_TAG}
          Source: https://github.com/noisefactorllc/shade-mcp/releases/tag/${SHADE_MCP_TAG}"

          # main moves on its own schedule, and this job is dispatched by a
          # shade-mcp release rather than by anything happening here — so an
          # ordinary push landing between the checkout and this push is
          # normal, not exceptional. Without the rebase that push is rejected
          # and the whole vendor drop is lost until someone notices, which is
          # how v0.2.1 failed to reach either consumer.
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            echo "push attempt ${attempt} lost a race; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not land the vendor drop after 3 attempts"
          exit 1
